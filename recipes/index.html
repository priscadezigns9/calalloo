<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipes | Calalloo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,900&family=Inter:wght@400;600;800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #F7F3ED;
            --primary: #E87722;
            --dark: #191613;
            --mid: #756D64;
            --white: #FFFFFF;
            --font-display: 'Fraunces', serif;
            --font-sans: 'Inter', sans-serif;
            --font-mono: 'DM Sans', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: var(--bg); color: var(--dark); font-family: var(--font-sans); line-height: 1.6; -webkit-font-smoothing: antialiased; }
        
        header { position: fixed; top: 0; width: 100%; padding: 1.5rem 2rem; display: flex; justify-content: space-between; align-items: center; z-index: 1000; background: rgba(247, 243, 237, 0.94); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(25, 22, 19, 0.08); }
        .nav-brand { font-family: var(--font-display); font-weight: 900; font-size: 1.5rem; color: var(--primary); text-decoration: none; }
        
        .hero { padding: 12rem 2rem 4rem; max-width: 1200px; margin: 0 auto; }
        .lab-tag { font-family: var(--font-mono); font-size: 0.75rem; color: var(--primary); text-transform: uppercase; letter-spacing: 0.3em; margin-bottom: 1.5rem; display: block; }
        .hero h1 { font-family: var(--font-display); font-size: 5rem; line-height: 0.85; letter-spacing: -0.04em; margin-bottom: 2rem; }

        .recipe-grid { max-width: 1400px; margin: 0 auto 8rem; padding: 0 2rem; display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 2rem; }
        
        .recipe-card { aspect-ratio: 4/5; background: var(--white); border-radius: 4px; overflow: hidden; border: 1px solid rgba(255,255,255,0.03); transition: all 0.4s ease; text-decoration: none; color: inherit; position: relative; }
        .recipe-card:hover { transform: translateY(-10px); border-color: var(--primary); }
        
        .recipe-image { width: 100%; height: 100%; aspect-ratio: auto; object-fit: cover; filter: none; transition: filter 0.4s ease; }
        .recipe-card:hover .recipe-image { filter: none; }
        
        .recipe-content { padding: 2rem; position: absolute; bottom: 0; width: 100%; background: linear-gradient(to bottom, transparent, var(--white)); }
        .recipe-content h3 { font-family: var(--font-display); font-size: 2rem; margin-bottom: 0.5rem; }
        .recipe-meta { display: flex; justify-content: space-between; font-family: var(--font-mono); font-size: 0.7rem; color: var(--primary); text-transform: uppercase; }

        footer { padding: 4rem; border-top: 1px solid rgba(255,255,255,0.05); text-align: center; font-family: var(--font-mono); font-size: 0.7rem; color: var(--mid); text-transform: uppercase; letter-spacing: 0.2em; }
    </style>
</head>
<body>

    <header>
        <a href="../index.html" class="nav-brand">
            <img src="../assets/logo.png" alt="Logo" style="height: 32px; vertical-align: middle; margin-right: 8px;">
            Calalloo
        </a>
        <nav>
            <a href="../blog/" style="text-decoration: none; color: var(--mid); font-family: var(--font-mono); font-size: 0.7rem; margin-right: 2rem;">Journal</a>
            <a href="../login/" style="text-decoration: none; color: var(--primary); font-family: var(--font-mono); font-size: 0.7rem; font-weight: 700;">Sign In</a>
        </nav>
    </header>

    <main>
        <section class="hero">
            <h1>The Recipe Archive.</h1>
        </section>

        <div class="recipe-grid" aria-live="polite"><p style="grid-column:1/-1;text-align:center;color:var(--mid);padding:3rem 0">Loading recipes…</p></div>
            </a>

            <!-- Oil Down -->
            <a href="grenadian-oil-down/" class="recipe-card">
                <img src="../assets/heritage/oil-down.jpg" class="recipe-image" alt="Grenadian Oil Down">
                <div class="recipe-content">
                    <h3>Grenadian Oil Down</h3>
                    <div class="recipe-meta"><span>National Hub</span><span>540 kcal</span></div>
                </div>
            </a>

            <!-- Pelau -->
            <a href="chicken-pelau/" class="recipe-card">
                <img src="../assets/heritage/pelau.jpg" class="recipe-image" alt="Chicken Pelau">
                <div class="recipe-content">
                    <h3>Chicken Pelau</h3>
                    <div class="recipe-meta"><span>Island Fuel</span><span>480 kcal</span></div>
                </div>
            </a>

            <!-- Pholourie -->
            <a href="pholourie/" class="recipe-card">
                <img src="../assets/heritage/pholourie.jpg" class="recipe-image" alt="Pholourie">
                <div class="recipe-content">
                    <h3>Pholourie</h3>
                    <div class="recipe-meta"><span>Street Discovery</span><span>190 kcal</span></div>
                </div>
            </a>

            <!-- Sahina -->
            <a href="sahina/" class="recipe-card">
                <img src="../assets/heritage/sahina.png" class="recipe-image" alt="Sahina">
                <div class="recipe-content">
                    <h3>Sahina</h3>
                    <div class="recipe-meta"><span>Leafy dish</span><span>210 kcal</span></div>
                </div>
            </a>
        </div>
    </main>

    <footer>
        &copy; 2026 Calalloo. A Prisca Dezigns Project.
    </footer>

<script src="../js/recipe-archive.js"></script>
</body>
</html>
