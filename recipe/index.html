<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Recipe | Calalloo</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,900&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--ink:#191613;--paper:#f7f3ed;--orange:#e87722;--line:#ded6cc;--muted:#756d64}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,sans-serif}header{padding:1.4rem 5%;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)}header a{color:inherit;text-decoration:none;font-weight:800}.back{color:var(--orange)}main{max-width:1100px;margin:0 auto;padding:4rem 5% 7rem}.hero{display:grid;grid-template-columns:1.05fr .95fr;gap:3rem;align-items:center}.hero img{width:100%;aspect-ratio:1.15;object-fit:cover;border-radius:24px;box-shadow:0 18px 40px #2d211515}.eyebrow{color:var(--orange);font-size:.75rem;font-weight:800;letter-spacing:.16em;text-transform:uppercase}.title{font:900 clamp(2.7rem,7vw,6.5rem)/.92 Fraunces,serif;margin:.8rem 0 1.2rem}.desc{font-size:1.1rem;line-height:1.75;color:var(--muted)}.save{border:0;border-radius:999px;padding:1rem 1.4rem;background:var(--orange);color:white;font-weight:800;cursor:pointer}.save.saved{background:#26221e}.save-note{font-size:.82rem;color:var(--muted);margin-top:.7rem}.body{display:grid;grid-template-columns:1fr 1fr;gap:3rem;margin-top:5rem;padding-top:3rem;border-top:1px solid var(--line)}h2{font:700 2.3rem Fraunces,serif;margin-top:0}ol{padding-left:1.3rem;line-height:1.9;color:var(--muted)}.status{padding:4rem;text-align:center;color:var(--muted)}@media(max-width:760px){.hero,.body{grid-template-columns:1fr}.hero{display:flex;flex-direction:column-reverse;gap:1.5rem}.title{font-size:3.7rem}}
</style></head>
<body><header><a href="../">Calalloo</a><a class="back" href="../recipes/">← All recipes</a></header><main id="app"><div class="status">Loading recipe…</div></main><footer></footer>
<script>
const SB_URL='https://sktpjacowqaedddtrhuz.supabase.co';
const SB_KEY='sb_publishable_ChdrHQEJV7pVpJMKt-ZaUw_6V0WRKAR';
const sb=supabase.createClient(SB_URL,SB_KEY); const id=new URLSearchParams(location.search).get('id');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const slugify=s=>String(s||'recipe').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
async function load(){if(!id){app.innerHTML='<div class="status">Recipe not found.</div>';return}const {data:r,error}=await sb.from('recipes').select('*').eq('id',id).single();if(error||!r){app.innerHTML='<div class="status">Recipe not found.</div>';return}const steps=Array.isArray(r.instructions)?r.instructions:[];app.innerHTML=`<section class="hero"><div><div class="eyebrow">${esc(r.country||'General')} · Recipe</div><h1 class="title">${esc(r.title)}</h1><p class="desc">${esc(r.description||'A Caribbean recipe to discover and share.')}</p><button class="save" id="save">♡ Save recipe</button><div class="save-note" id="save-note">Saving recipes is available to signed-in account holders.</div></div><img src="${esc(r.cover_photo_url||'')}" alt="${esc(r.title)}"></section><section class="body"><div><h2>How to make it</h2>${steps.length?`<ol>${steps.map(x=>`<li>${esc(x)}</li>`).join('')}</ol>`:'<p class="desc">Recipe instructions are being prepared.</p>'}</div><div><h2>Share your version</h2><p class="desc">Comment, reply, like the recipe or upload a food photo as a guest. Community uploads are reviewed before appearing publicly.</p></div></section>`;await loadSave();document.getElementById('save').onclick=toggleSave;}
async function loadSave(){const {data:{user}}=await sb.auth.getUser();if(!user)return;const {data}=await sb.from('saved_recipes').select('id').eq('user_id',user.id).eq('recipe_id',id).maybeSingle();if(data){save.classList.add('saved');save.textContent='✓ Saved recipe';}}
async function toggleSave(){const {data:{user}}=await sb.auth.getUser();if(!user){location.href='../login/?next='+encodeURIComponent(location.href);return}const {data:existing}=await sb.from('saved_recipes').select('id').eq('user_id',user.id).eq('recipe_id',id).maybeSingle();if(existing){await sb.from('saved_recipes').delete().eq('id',existing.id);save.classList.remove('saved');save.textContent='♡ Save recipe';}else{const {error}=await sb.from('saved_recipes').insert({user_id:user.id,recipe_id:id,collection_name:'Saved Recipes'});if(!error){save.classList.add('saved');save.textContent='✓ Saved recipe';}}}
load();
</script><script src="../js/guest-community.js"></script></body></html>
